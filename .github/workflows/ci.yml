name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install light dependencies (no torch, no model download)
        run: pip install numpy rank-bm25 pylatexenc pypdf python-dotenv pytest ruff
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
